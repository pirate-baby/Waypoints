name: Test scripts

# Runs the PR's own scripts, so it only runs when they change, and outside
# contributors need approval first. CSV-only changes are checked by
# check-csv.yml without approval.
on:
  pull_request:
    paths:
      - "**.py"
      - "**.sh"
      - ".github/**"

permissions:
  contents: read

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the Python on the OpenPlotter Pi.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Also downloads every emoji icon, so an emoji Twemoji doesn't have fails here.
      - name: Convert waypoints.csv
        run: |
          mkdir -p out
          if ! python3 csv_to_gpx.py waypoints.csv -o out/waypoints.gpx 2> out/errors.txt; then
            cat out/errors.txt
            # Turn "file:line: message" into annotations on the PR diff.
            sed -nE 's/^([^:]+):([0-9]+): (.*)$/::error file=\1,line=\2::\3/p' out/errors.txt
            exit 1
          fi
          cat out/errors.txt

      - uses: actions/upload-artifact@v4
        with:
          name: waypoints-overlay
          path: |
            out/waypoints.gpx
            out/waypoints-icons.zip
